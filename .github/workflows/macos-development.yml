# Unsigned development delivery. Public release templates remain RightGit-owned.
name: legion-macos-development
on:
  push:
    branches: ['codex/legion-macos-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legion-macos-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-installer:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> target
          shared-key: legion-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - run: pnpm install --frozen-lockfile
      - name: Check whole native workspace & native behavior
        run: |
          cargo check --manifest-path engine/Cargo.toml --workspace --all-targets --locked --release --target aarch64-apple-darwin
          cargo test --manifest-path engine/Cargo.toml --locked --release --target aarch64-apple-darwin -p legion-hook
          cargo test --manifest-path engine/Cargo.toml --locked --release --target aarch64-apple-darwin -p legion-apple
      - name: Assemble & qualify exact unsigned native candidate
        run: |
          cargo build --manifest-path engine/Cargo.toml --locked --release --target aarch64-apple-darwin --bins
          engine/target/aarch64-apple-darwin/release/legion-dev refresh-local-skill-manifests --check ios-development macos-development
          xtask="$PWD/engine/target/aarch64-apple-darwin/release/xtask"
          "$xtask" assemble-native-release --profile release --platform macos --architecture arm64 --target aarch64-apple-darwin --out "$RUNNER_TEMP/legion-install"
          "$xtask" native-installed-smoke "$RUNNER_TEMP/legion-install"
          "$xtask" prepare-unsigned-candidate --input "$RUNNER_TEMP/legion-install" --output "$RUNNER_TEMP/legion-macos-delivery/candidate" --platform macos --architecture arm64 --source-revision "$GITHUB_SHA"
          "$xtask" prepare-unsigned-candidate --check --output "$RUNNER_TEMP/legion-macos-delivery/candidate" --platform macos --architecture arm64 --source-revision "$GITHUB_SHA"
      - name: Package existing installer & exercise headless installation
        timeout-minutes: 5
        run: |
          app="$RUNNER_TEMP/legion-macos-delivery/Legion Installer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          swiftc -parse-as-library scripts/release/macos/LegionInstaller.swift -framework Cocoa -o "$app/Contents/MacOS/Legion Installer"
          cp -R "$RUNNER_TEMP/legion-install" "$app/Contents/Resources/payload"
          printf '0.3.21\n' > "$app/Contents/Resources/version.txt"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string Legion Installer' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.orthiclabs.legion.installer' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$app/Contents/Info.plist"
          # Qualification uses a Codex configuration fixture on this disposable runner.
          mkdir -p "$HOME/.codex"
          "$app/Contents/MacOS/Legion Installer" --headless 2> "$RUNNER_TEMP/legion-macos-delivery/installer-qualification.log"
          tar -czf "$RUNNER_TEMP/legion-macos-delivery/Legion-0.3.21-macos-arm64-installer.tar.gz" -C "$RUNNER_TEMP/legion-macos-delivery" 'Legion Installer.app'
          rm -r "$app"
      - name: Upload exact installer & native candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legion-macos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/legion-macos-delivery/
          if-no-files-found: error
          retention-days: 14
