# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: workflows.custom | Template version: 1.8.0
name: legion-linux-audit-artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legion-linux-audit-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  build:
    needs: [private-repo-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - name: RightKit ownership (protected registry roots)
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: 1.98.0
      - name: 'Build and qualify Linux Audit payload'
        shell: bash
        run: |
          bash scripts/ci/linux-audit-artifact.sh
      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: 'dist/linux-audit/*'
          retention-days: 7
          if-no-files-found: error
