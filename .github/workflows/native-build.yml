name: native-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/build-native.mjs
      - run: node --test tests/native-equivalence.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nemesis-native-${{ matrix.os }}
          path: dist/
