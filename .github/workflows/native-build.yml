name: native-build-contract

on:
  workflow_dispatch:

permissions:
  contents: read

# Native builds require platform hosts plus an injected executable.  Do not use
# floating GitHub Actions references to manufacture release evidence.
jobs:
  blocked-until-pinned:
    runs-on: ubuntu-latest
    steps:
      - name: Block unpinned hosted native execution
        run: |
          echo "BLOCKED: immutable action pins & platform build hosts are required."
          exit 1
