# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/regenerate.yml | Template version: 1.8.0
# Manual only. Runs the repository's regenerate script (derived artifacts,
# formatting, lockfile repair) and, when tracked files change, runs the ci
# gate on the result, pushes it to a right-git/regenerate-<run> branch and
# opens a pull request. It never writes to the default branch. Pull requests
# opened with the workflow token do not trigger pull_request workflows, which
# is why the gate runs here and the PR body links this run.
name: legion-regenerate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legion-regenerate
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  regenerate:
    needs: [private-repo-guard]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile

      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            engine -> target
          shared-key: legion-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: false
      - name: Regenerate derived artifacts
        run: pnpm run ci:regenerate
      - name: Detect regenerated files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Derived artifacts are already current."
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Gate the regenerated tree
        if: steps.changes.outputs.changed == 'true'
        run: bash ./scripts/gate.sh
        env:
          RIGHT_GIT_RUST_CHANGED: "true"
          RIGHT_GIT_RUST_REQUIRED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
      - name: Open a pull request with the regenerated files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHT_GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RIGHT_GIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="right-git/regenerate-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Regenerate derived artifacts"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$RIGHT_GIT_DEFAULT_BRANCH" --head "$branch" \
            --title "Regenerate derived artifacts" \
            --body "Opened by the right-git regenerate lane. The ci gate passed on this tree in $RIGHT_GIT_RUN_URL (pull requests opened with the workflow token do not trigger pull_request workflows)."
