# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/sign-existing.yml | Template version: 1.8.0
# Manual only. Signs an already-qualified artifact of another run of this repository
# with right-release sign-dev-artifact (fixed per-file identifiers, Developer ID) inside
# the protected signing environment. It verifies the run, artifact and source commit
# through the GitHub API first, never rebuilds and never builds a release.
name: legion-sign-existing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id that produced the qualified artifact
        required: true
        type: string
      artifact:
        description: Artifact id or artifact name inside that run
        required: true
        type: string
      source_sha:
        description: Source commit the artifact was built from (7 to 40 lowercase hex characters, a prefix of the run head sha)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: legion-sign-existing
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1

  sign-existing:
    # Default branch only: the signing code and sign manifest come from this revision, and the protected
    # environment's rules (required reviewers, branch policy) apply. Nothing here compiles the app.
    needs: [private-repo-guard]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
    environment: release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - name: Verify the existing artifact belongs to this repository, run and source commit
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash scripts/ci/sign-existing-verify.sh
      - name: Download the verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          run-id: ${{ steps.verify.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/existing-artifact
      - name: Install Apple signing identity in temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Developer ID sign existing artifact (no rebuild, no notarization)
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/existing-artifact"
          work="$RUNNER_TEMP/dev-sign"
          rm -rf "$work" && mkdir -p "$work" "$RUNNER_TEMP/dev-signed"
          zips=()
          while IFS= read -r -d '' file; do zips+=("$file"); done < <(find "$downloaded" -type f -name '*.zip' -print0)
          if [ "${#zips[@]}" -eq 1 ]; then
            ditto -x -k "${zips[0]}" "$work"
            out="$(basename "${zips[0]}")"
          elif [ "${#zips[@]}" -eq 0 ]; then
            ditto "$downloaded" "$work"
            out="signed-artifact.zip"
          else
            echo "sign-existing refused: the artifact holds more than one zip" >&2
            exit 1
          fi
          pnpm exec right-release sign-dev-artifact --artifact "$work" --manifest "$GITHUB_WORKSPACE/packaging/macos/dev-sign-manifest.json" --metadata "$work/payload.json" --evidence "$RUNNER_TEMP/dev-signed/sign-evidence.json"
          ditto -c -k "$work" "$RUNNER_TEMP/dev-signed/$out"
      - name: Upload signed existing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ steps.verify.outputs.artifact_name }}-${{ steps.verify.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/dev-signed/*.zip
            ${{ runner.temp }}/dev-signed/sign-evidence.json
            ${{ runner.temp }}/dev-signed/source-verification.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove Apple signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-signing.p12"
