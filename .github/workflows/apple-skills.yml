name: apple-skills
on:
  push:
    branches: ['codex/apple-skill-absorption']
  pull_request:
    paths:
      - 'skills/ios-development/**'
      - 'skills/macos-development/**'
      - 'skills/manifests/*-development.json'
      - 'docs/apple-absorption/**'
      - 'engine/crates/legion-apple/**'
      - 'engine/bins/legion/**'
      - 'engine/bins/legion-dev/**'
      - 'engine/Cargo.*'
      - '.github/workflows/apple-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-skills-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> target
          shared-key: legion-rust
          add-job-id-key: false
          cache-on-failure: true
      - name: Generate canonical bundle projections
        shell: bash
        run: |
          set -uo pipefail
          result=0
          generate() { "$@" || result=1; }
          generate cargo check --manifest-path engine/Cargo.toml -p legion-apple
          generate cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-codex-skill-sidecars
          generate cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-skill-catalog
          generate cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-host-projection
          generate cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- refresh-local-skill-manifests ios-development macos-development
          generate cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- native-cli-inventory
          git diff --binary > apple-generated.patch
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apple-generated-${{ github.sha }}
          path: apple-generated.patch
          retention-days: 7
      - name: Verify bundle closure, provenance & helpers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          result=0
          verify() { "$@" || result=1; }
          verify cargo test --locked --manifest-path engine/Cargo.toml -p legion-apple
          verify cargo test --locked --manifest-path engine/Cargo.toml -p legion-dev apple_skill_integrity
          verify cargo test --locked --manifest-path engine/Cargo.toml -p legion --test apple_cli --test script_cli --test m1_vertical_slice --no-fail-fast
          verify cargo test --locked --manifest-path engine/Cargo.toml -p legion --bin legion apple_
          verify cargo test --locked --manifest-path engine/Cargo.toml -p xtask canonical_mcp_schema
          verify cargo test --locked --manifest-path engine/Cargo.toml -p legion-runtime --test role_host_binding
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- check-authority-parity
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-codex-skill-sidecars --check
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-skill-catalog --check
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- generate-host-projection --check
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- refresh-local-skill-manifests --check ios-development macos-development
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- check-dependency-closure
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- check-native-cli-surface --phase enforce
          verify cargo run -q --locked --manifest-path engine/Cargo.toml -p legion-dev -- verify-plugin-parity --check --structural-only
          exit "$result"
      - name: Reject uncommitted generated drift
        if: ${{ !cancelled() }}
        shell: bash
        run: git diff --exit-code
