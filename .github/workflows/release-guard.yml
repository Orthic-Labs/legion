name: release-guard

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publication-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Node runtime
        run: node --version
      - name: Block publication without an explicit policy grant
        run: node scripts/check-publication-policy.mjs --channel signed-release
      - name: Block npm publication without an explicit policy grant
        run: node scripts/check-publication-policy.mjs --channel npm
      - name: Internal pack channel is allowed for CI
        run: node scripts/check-publication-policy.mjs --channel internal-pack
