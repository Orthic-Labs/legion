name: legion-entrypoint-inventory

on:
  push:
    branches: [main]
    paths:
      - "engine/bins/legion/tests/entrypoint_inventory.rs"
      - ".github/workflows/entrypoint-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            engine -> target
          shared-key: legion-rust
          add-job-id-key: false
          cache-workspace-crates: false
      - name: Build inventory binaries
        run: |
          cargo build --locked --manifest-path engine/Cargo.toml -p legion -p legion-dev -p xtask
          cargo test --locked --manifest-path engine/Cargo.toml -p legion --test entrypoint_inventory --no-run --message-format=json > "$RUNNER_TEMP/entrypoint-build.jsonl"
      - name: Probe all Legion entry points
        env:
          LEGION_BIN: ${{ github.workspace }}/engine/target/debug/legion
          LEGION_DEV_BIN: ${{ github.workspace }}/engine/target/debug/legion-dev
          XTASK_BIN: ${{ github.workspace }}/engine/target/debug/xtask
          LEGION_ENTRYPOINT_REPORT: ${{ runner.temp }}/legion-entrypoint-inventory.json
        run: |
          test_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "entrypoint_inventory" and .executable != null) | .executable' "$RUNNER_TEMP/entrypoint-build.jsonl")
          test -x "$test_binary"
          original_network=$(readlink /proc/self/ns/net)
          sudo env LEGION_ENTRYPOINT_ORIGINAL_NET="$original_network" LEGION_BIN="$LEGION_BIN" LEGION_DEV_BIN="$LEGION_DEV_BIN" XTASK_BIN="$XTASK_BIN" LEGION_ENTRYPOINT_REPORT="$LEGION_ENTRYPOINT_REPORT" unshare --net -- "$test_binary" --ignored --nocapture
      - name: Upload entrypoint inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legion-entrypoint-inventory-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/legion-entrypoint-inventory.json
