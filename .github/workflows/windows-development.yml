# Legion unsigned development lane; public release templates stay RightGit-owned.
name: legion-windows-development
on:
  push:
    branches: ['codex/legion-windows-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legion-windows-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  unsigned-installer:
    needs: [private-repo-guard]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> target
          shared-key: legion-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - run: pnpm install --frozen-lockfile
      - name: Check whole native workspace & all targets
        run: cargo check --manifest-path engine/Cargo.toml --workspace --all-targets --locked --release --target x86_64-pc-windows-msvc
      - name: Verify native Codex Stop behavior
        run: cargo test --manifest-path engine/Cargo.toml --locked --release --target x86_64-pc-windows-msvc -p legion-hook
      - name: Build exact unsigned installer
        shell: pwsh
        run: |
          & ./scripts/release/local-windows-development.ps1 -BuildOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify exact installed artifact in isolation
        shell: pwsh
        run: |
          $env:RIGHT_GIT_FINALIZED_WINDOWS_ROOT = Join-Path $PWD 'dist/local-windows/installer'
          $env:RIGHT_GIT_QUALIFICATION_EVIDENCE_ROOT = Join-Path $PWD 'dist/local-windows/qualification'
          & ./engine/target/x86_64-pc-windows-msvc/release/xtask.exe release-qualify-installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer, assembly hashes & qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legion-windows-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/local-windows/installer/
            dist/local-windows/qualification/qualification.json
            dist/local-windows/qualification/qualification-failure.json
            dist/local-windows/qualification/**/*.log
            dist/native/windows-x86_64/legion-*/
