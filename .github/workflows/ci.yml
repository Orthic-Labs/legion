name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: node scripts/generate-schemas.mjs --check
      - run: node scripts/self-test.mjs
      - run: node --test --test-concurrency=1 "tests/*.test.mjs"
      - run: node tests/run-audit-conformance-tests.mjs
      - run: node bench/run-bench.mjs
      - run: npm pack --dry-run --json
        if: ${{ hashFiles('package.json') != '' }}

  verifier-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node --test tests/audit-verify.test.mjs
