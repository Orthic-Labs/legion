name: release-contract

on:
  workflow_dispatch:

permissions:
  contents: read

# Hosted release work is deliberately unavailable until every third-party
# action has a locally verified immutable SHA.  This workflow never builds,
# signs, uploads, attests, or publishes a release candidate.
jobs:
  blocked-until-pinned:
    runs-on: ubuntu-latest
    steps:
      - name: Block unpinned hosted release execution
        run: |
          echo "BLOCKED: immutable action pins, signing credentials, & platform hosts are required."
          exit 1
