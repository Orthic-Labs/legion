[package]
name = "legion-workspace-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Compiles the workspace-level integration tests that live in engine/tests."

[lib]
path = "src/lib.rs"

[dev-dependencies]
legion-contracts = { path = "../legion-contracts" }
legion-effects = { path = "../legion-effects" }
legion-host = { path = "../legion-host" }
legion-policy-model = { path = "../legion-policy-model" }
serde_json.workspace = true

# m2_portable_integration.rs is compiled as a module of native_hosts.rs.
# native_audit.rs and m5_provider_boundary.rs are wired from legion-audit and
# legion-provider-sdk.
[[test]]
name = "m3_setup_state"
path = "../../tests/m3_setup_state.rs"

[[test]]
name = "m6_installed_product"
path = "../../tests/m6_installed_product.rs"

[[test]]
name = "native_contracts"
path = "../../tests/native_contracts.rs"

[[test]]
name = "native_effects"
path = "../../tests/native_effects.rs"

[[test]]
name = "native_hosts"
path = "../../tests/native_hosts.rs"

[[test]]
name = "native_no_interpreter"
path = "../../tests/native_no_interpreter.rs"

[[test]]
name = "native_policy"
path = "../../tests/native_policy.rs"

[[test]]
name = "native_python_surfaces"
path = "../../tests/native_python_surfaces.rs"
