events {}
http {
    proxy_cache_path /var/cache/nginx keys_zone=shared:10m;
    server { listen 80;
      location /account/ { proxy_cache shared; proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_valid 200 10m; auth_request /auth; proxy_pass http://app/account/; }
      location = /auth { internal; proxy_pass http://auth/check; }
    }
}
