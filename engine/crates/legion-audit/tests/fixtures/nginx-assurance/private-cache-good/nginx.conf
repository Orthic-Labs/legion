events {}
http {
    proxy_cache_path /var/cache/nginx keys_zone=shared:10m;
    server { listen 80;
      location /account/ { proxy_cache shared; proxy_cache_key "$scheme$host$uri$http_authorization";
        proxy_no_cache $http_authorization; proxy_cache_bypass $http_authorization;
        auth_request /auth; proxy_pass http://app/account/; }
      location = /auth { internal; proxy_pass http://auth/check; }
      location /public/ { proxy_cache shared; proxy_pass http://app/public/; }
    }
}
