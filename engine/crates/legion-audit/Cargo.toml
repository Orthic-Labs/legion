[package]
name = "legion-audit"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
regex.workspace = true
async-trait.workspace = true
rightkit-evidence-contracts = "=0.1.0"
legion-host = { path = "../legion-host" }
rightkit-evidence-report = "=0.1.0"
rightkit-code-audit-provider-sdk = "=0.1.0"
rightkit-policy-rules = "=0.1.0"
rightkit-evidence-effects = "=0.1.0"
headless_chrome.workspace = true
hmac.workspace = true
hex.workspace = true
getrandom = "0.4.3"
sha2.workspace = true
sha1 = "=0.11.0"
ed25519-dalek = "=3.0.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
image.workspace = true
thiserror.workspace = true
walkdir.workspace = true
tokio-util.workspace = true
tokio.workspace = true
toml.workspace = true
rightkit-ownership = "=0.4.4"
rightkit-browser = "=0.3.6"
rightkit-child-process = "=0.5.7"
rightkit-fs = { version = "=0.4.9", default-features = false, features = ["fs", "json"] }
rightkit-cache = "=0.2.3"
rightkit-agents = { version = "=0.2.0", features = ["claude"] }
