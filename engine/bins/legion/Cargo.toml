[package]
name = "legion"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
[[bin]]
name = "legion"
path = "src/main.rs"
[[test]]
name = "audit_review_runtime"
path = "tests/audit_review_runtime.rs"
harness = false
[dependencies]
rightkit-apple-ops = "=0.1.1"
clap.workspace = true
hmac.workspace = true
hex.workspace = true
legion-audit = { path = "../../crates/legion-audit" }
legion-application = { path = "../../crates/legion-application" }
legion-arcane = { path = "../../crates/legion-arcane" }
legion-catalog = { path = "../../crates/legion-catalog" }
legion-contracts = { path = "../../crates/legion-contracts" }
legion-decisions = { path = "../../crates/legion-decisions" }
legion-effects = { path = "../../crates/legion-effects" }
legion-handoff = { path = "../../crates/legion-handoff" }
legion-mcp = { path = "../legion-mcp" }
legion-host = { path = "../../crates/legion-host" }
legion-harness = { path = "../../crates/legion-harness" }
legion-policy = { path = "../../crates/legion-policy" }
legion-policy-model = { path = "../../crates/legion-policy-model" }
legion-provider-sdk = { path = "../../crates/legion-provider-sdk" }
legion-report = { path = "../../crates/legion-report" }
rightkit-research = "=0.1.1"
rightkit-review = { version = "=0.4.1", default-features = false, features = ["code", "minimize"] }
rightkit-code-audit-provider-sdk = "=0.1.0"
rightkit-evidence-contracts = "=0.1.0"
legion-rules = { path = "../../crates/legion-rules" }
legion-runtime = { path = "../../crates/legion-runtime" }
legion-topology = { path = "../../crates/legion-topology" }
reqwest.workspace = true
rightkit-child-process = "=0.5.7"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
async-trait.workspace = true
