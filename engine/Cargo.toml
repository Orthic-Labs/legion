[workspace]
resolver = "2"
members = [
    "crates/legion-application",
    "crates/legion-audit",
    "crates/legion-catalog",
    "crates/legion-contracts",
    "crates/legion-decisions",
    "crates/legion-effects",
    "crates/legion-handoff",
    "crates/legion-host",
    "crates/legion-policy-model",
    "crates/legion-policy",
    "crates/legion-provider-sdk",
    "crates/legion-report",
    "crates/legion-research",
    "crates/legion-review",
    "crates/legion-rules",
    "crates/legion-runtime",
    "crates/legion-testkit",
    "bins/legion",
    "bins/legion-hook",
    "bins/legion-mcp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "LicenseRef-Orthic-Labs-Source-Use-1.0"
license-file = "../LICENSE"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
async-trait = "0.1.92"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
regex = "1.13.1"
walkdir = "2.5.0"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3.34"
secrecy = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.4"
libc = "1.0.0-alpha.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
tiktoken-rs = "0.12.0"

[profile.dev]
# line-tables-only: full debuginfo dominates large-crate dev codegen; backtraces keep file:line
debug = "line-tables-only"
