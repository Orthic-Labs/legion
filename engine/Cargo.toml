[workspace]
resolver = "2"
members = [
    "crates/legion-application",
    "crates/legion-audit",
    "crates/legion-catalog",
    "crates/legion-contracts",
    "crates/legion-decisions",
    "crates/legion-effects",
    "crates/legion-handoff",
    "crates/legion-host",
    "crates/legion-policy-model",
    "crates/legion-policy",
    "crates/legion-provider-sdk",
    "crates/legion-report",
    "crates/legion-research",
    "crates/legion-review",
    "crates/legion-rules",
    "crates/legion-runtime",
    "crates/legion-testkit",
    "bins/legion",
    "bins/legion-hook",
    "bins/legion-mcp",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Orthic-Labs-Source-Use-1.0"
license-file = "../LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
secrecy = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
jsonschema = "0.33"
toml = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
tiktoken-rs = "0.6"
