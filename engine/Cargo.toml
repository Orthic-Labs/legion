[workspace]
resolver = "2"
members = [
    "crates/legion-apple",
    "crates/legion-application",
    "crates/legion-arcane",
    "crates/legion-audit",
    "crates/legion-catalog",
    "crates/legion-contracts",
    "crates/legion-decisions",
    "crates/legion-effects",
    "crates/legion-handoff",
    "crates/legion-host",
    "crates/legion-harness",
    "crates/legion-minimize",
    "crates/legion-policy-model",
    "crates/legion-policy",
    "crates/legion-provider-sdk",
    "crates/legion-report",
    "crates/legion-research",
    "crates/legion-review",
    "crates/legion-rules",
    "crates/legion-runtime",
    "crates/legion-topology",
    "crates/legion-workspace-tests",

    "bins/legion",
    "bins/legion-dev",
    "bins/legion-hook",
    "bins/legion-mcp",

    "xtask",
]

[workspace.package]
version = "0.3.23"
edition = "2021"
license = "LicenseRef-Orthic-Labs-Source-Use-1.0"
license-file = "../LICENSE"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
async-trait = "0.1.92"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
regex = "1.13.1"
walkdir = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "query", "form"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
futures-util = "0.3.34"
secrecy = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.8"
libc = "1.0.0-alpha.5"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
tiktoken-rs = "0.12.0"
zip = { version = "9.0.4", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate-flate2", "deflate-zopfli", "lzma", "time", "zstd", "xz"] }
tar = "0.4"
flate2 = "1"
brotli = "9.0.0"
headless_chrome = "1"
lopdf = "0.45.0"
image = "0.25"
scraper = "0.27.0"

[profile.dev]
# line-tables-only: full debuginfo dominates large-crate dev codegen; backtraces keep file:line
debug = "line-tables-only"

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false
