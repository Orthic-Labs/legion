interface:
  display_name: "Dispatch"
  short_description: "Delegate bounded work to fresh-context agents with clear ownership & integration. Use for subagents, parallel workers, or executor instructions. Same-agent planning uses Tasklist; new-session continuity uses Handoff."
  default_prompt: "Use $dispatch when this request matches: Delegate bounded work to fresh-context agents with clear ownership & integration. Use for subagents, parallel workers, or executor instructions. Same-agent planning uses Tasklist; new-session continuity uses Handoff."
policy:
  allow_implicit_invocation: true
