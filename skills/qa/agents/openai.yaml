interface:
  display_name: "Qa"
  short_description: "Write tests only for native, backend, or web behavior, or add, run, or audit web app QA with hidden servers, deterministic mocks, functional/browser assertions, viewport evidence, and runtime checks. Desktop and Tauri app QA runs through RightKit QA on the real installed build."
  default_prompt: "Use $qa when this request matches: Write tests only for native, backend, or web behavior, or add, run, or audit web app QA with hidden servers, deterministic mocks, functional/browser assertions, viewport evidence, and runtime checks. Desktop and Tauri app QA runs through RightKit QA on the real installed build."
policy:
  allow_implicit_invocation: true
