interface:
  display_name: "Blueprint"
  short_description: "Query or reconcile a repository graph or current-state map through the optional Blueprint host capability (blueprint-graph) when that map is requested or required. Use for /blueprint, repository onboarding, architecture/flow maps, impact analysis, docs reconciliation, or grounding Audit/Architect. Excludes chat transcripts and ordinary bounded file inspection. Without the host capability it returns a NO_CAPABILITY result."
  default_prompt: "Use $blueprint when this request matches: Query or reconcile a repository graph or current-state map through the optional Blueprint host capability (blueprint-graph) when that map is requested or required. Use for /blueprint, repository onboarding, architecture/flow maps, impact analysis, docs reconciliation, or grounding Audit/Architect. Excludes chat transcripts and ordinary bounded file inspection. Without the host capability it returns a NO_CAPABILITY result."
policy:
  allow_implicit_invocation: true
