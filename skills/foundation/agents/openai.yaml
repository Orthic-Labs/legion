interface:
  display_name: "Foundation"
  short_description: "Create, audit, normalize, reconcile, or compare a product's atomic capability foundation. Use for atom inventories, cross-repository implementation bakeoffs, feature ledgers, closure counts, parent-child hierarchies, evidence rows, qualification gates, donor dispositions, or cross-canon standardization. `canon` & `compshop` are retired aliases; `/foundation compare` replaces CompShop."
  default_prompt: "Use $foundation when this request matches: Create, audit, normalize, reconcile, or compare a product's atomic capability foundation. Use for atom inventories, cross-repository implementation bakeoffs, feature ledgers, closure counts, parent-child hierarchies, evidence rows, qualification gates, donor dispositions, or cross-canon standardization. `canon` & `compshop` are retired aliases; `/foundation compare` replaces CompShop."
policy:
  allow_implicit_invocation: true
