interface:
  display_name: "Research"
  short_description: "Research a question from external sources and produce a cited, evidence-backed brief or analysis: current public guidance, market, competitor, technical, scientific, medical, legal, audience, scholarly, or trend questions, or NotebookLM work. Use when the answer requires searching and opening outside sources and recording dated claims and uncertainty. Not for reading local files or transcripts, or summarizing a source the user already supplied."
  default_prompt: "Use $research when this request matches: Research a question from external sources and produce a cited, evidence-backed brief or analysis: current public guidance, market, competitor, technical, scientific, medical, legal, audience, scholarly, or trend questions, or NotebookLM work. Use when the answer requires searching and opening outside sources and recording dated claims and uncertainty. Not for reading local files or transcripts, or summarizing a source the user already supplied."
policy:
  allow_implicit_invocation: true
