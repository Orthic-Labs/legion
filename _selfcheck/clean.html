<!doctype html>
<html>
  <head><meta charset="utf-8"><title>clean fixture</title></head>
  <body>
    <h1>Clean control</h1>
    <input id="x" type="text" placeholder="type here" style="width:300px;height:30px;font-size:16px">
    <div id="out"></div>
    <script>
      document.getElementById('x').addEventListener('input', function (e) {
        document.getElementById('out').textContent = 'len ' + e.target.value.length;
      });
    </script>
  </body>
</html>
