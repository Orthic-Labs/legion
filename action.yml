name: Legion Audit
description: Evidence-governed repository audit
inputs:
  profile:
    description: fast | standard | full | release
    default: standard
  baseline:
    description: Optional baseline artifact path
    required: false
  upload-sarif:
    description: Upload report.sarif
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: corepack pnpm@11.24.0 install --dir "$ACTION_PATH" --frozen-lockfile --prod
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        AUDIT_PROFILE: ${{ inputs.profile }}
      run: node "$ACTION_PATH/tools/audit/audit-run.mjs" "$GITHUB_WORKSPACE" --profile "$AUDIT_PROFILE" --out "$RUNNER_TEMP/legion"
