name: Legion Audit
description: Evidence-governed repository audit
inputs:
  profile:
    description: fast | standard | full | release
    default: standard
  baseline:
    description: Optional baseline artifact path
    required: false
  upload-sarif:
    description: Upload report.sarif
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      run: corepack pnpm@11.24.0 install --dir "${{ github.action_path }}" --frozen-lockfile --prod
    - shell: bash
      run: node "${{ github.action_path }}/tools/audit/audit-run.mjs" "$GITHUB_WORKSPACE" --profile "${{ inputs.profile }}" --out "$RUNNER_TEMP/legion"
